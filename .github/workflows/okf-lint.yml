name: OKF lint

on:
  pull_request:
    paths:
      - "docs/wiki/**"
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/lint_okf.py
