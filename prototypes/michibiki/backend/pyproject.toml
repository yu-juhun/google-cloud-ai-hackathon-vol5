[project]
name = "michibiki-services"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "google-genai>=1.0,<2", "google-auth>=2,<3",
  "sqlalchemy>=2,<3", "cloud-sql-python-connector[pg8000]>=1.18,<2",
  "google-cloud-storage>=3,<4", "websockets>=13,<14",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
